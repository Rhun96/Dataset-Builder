[project]
name = "dataset-builder-v2"
version = "0.1.0"
description = "Dataset Builder v2 — подготовка выборок, независимое ядро + файловый экспорт"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "odfpy>=1.4",
  "python-docx>=1.1",
  "PySide6==6.11.2",
  "PySide6-Fluent-Widgets==1.11.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
